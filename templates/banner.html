<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  body { background:#0b1220; color:#e6edf3; font-family:system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#161b26; border-radius:14px; padding:32px; box-shadow:0 8px 32px rgba(0,0,0,.4);
          max-width:420px; width:90%; text-align:center; }
  h1 { margin:0 0 8px; font-size:22px; }
  p  { margin:4px 0; color:#9aa4b2; }
</style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>
</body>
</html>
